[package]
name = "hamster-video"
version = "1.0.0"
edition = "2021"
license = "MIT"

[dependencies]
eframe = { version = "0.31.1", default-features = false, features = ["glow", "default_fonts"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
libc = "0.2"

[profile.release]
opt-level = 2
strip = true
